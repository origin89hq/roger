# Publishes roger-protocol and roger-cli to crates.io when a v<version> tag is
# pushed. Uses crates.io trusted publishing, so no registry token is stored.
name: release-crates

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-crates
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Require the tag to match both crate versions
        env:
          TAG: ${{ github.ref_name }}
        run: |
          for crate in roger-protocol roger-cli; do
            version=$(cargo metadata --no-deps --format-version 1 | jq -r --arg c "$crate" '.packages[] | select(.name == $c) | .version')
            test "v$version" = "$TAG" || { echo "$crate is $version; the tag is $TAG"; exit 1; }
          done
      # rustup installs the toolchain pinned in rust-toolchain.toml.
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      - name: Publish roger-protocol, then roger-cli
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked --workspace
