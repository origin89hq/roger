[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
repository = "https://github.com/origin89hq/roger"
homepage = "https://roger.origin89.com"

[workspace.dependencies]
clap = { version = "4.6.7", features = ["derive"] }
roger-protocol = { path = "crates/roger-protocol", version = "0.1.1" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-serde = "=0.0.12"
specta-typescript = "=0.0.12"
thiserror = "2.0.21"
ureq = "3.4.2"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
