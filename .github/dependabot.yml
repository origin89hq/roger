# Adapted from origin89hq/engineering templates/dependabot.yml; see its docs/dependencies.md.
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3 # zizmor: ignore[dependabot-cooldown] three days matches the Origin89 dependency policy
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: ci

  # pnpm workspaces use the npm ecosystem from the directory holding the lockfile.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # At least pnpm's minimumReleaseAge, or the frozen install rejects the update.
    cooldown:
      default-days: 3 # zizmor: ignore[dependabot-cooldown] three days matches the Origin89 dependency policy
    groups:
      npm:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: chore
      include: scope
